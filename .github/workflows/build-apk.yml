name: Build Leona Pro X EA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create . \
            --platforms=android \
            --org com.leonaprox

      - name: Add Android Internet permission
        run: |
          sed -i '/<manifest xmlns:android=/a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Set application name
        run: |
          sed -i 's/android:label="leona_pro_x_ea"/android:label="Leona Pro X EA"/' \
          android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Leona-Pro-X-EA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
